name: Bug 反馈 / 功能建议
description: 反馈问题或提出功能建议。
body:
  - type: markdown
    attributes:
      value: |
        ### 请尽量附上 WorkBuddy 的完整分析回复

        由于维护精力有限，感谢你先使用 WorkBuddy 分析遇到的问题或功能建议，并将 AI 的完整回复内容粘贴到下方。这能帮助我更直接地判断问题是否确实存在，以及是否需要优先处理。

  - type: dropdown
    id: issue-type
    attributes:
      label: 问题类型
      options:
        - Bug 反馈
        - 功能建议
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: 客户端
      options:
        - WorkBuddy（国内版）
        - WorkBuddy AI（国际版）
        - CodeBuddy CN（国内版）
        - CodeBuddy（国际版）
    validations:
      required: true

  - type: input
    id: client-version
    attributes:
      label: 客户端版本号
      placeholder: 请填写实际版本号
    validations:
      required: true

  - type: input
    id: workdaddy-version
    attributes:
      label: WorkDaddy / WorkDaddy AI / CodeDaddy CN / CodeDaddy 版本号
      placeholder: 例如：1.2.8
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题或建议描述
      description: 请说明实际现象、预期行为或使用场景。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / 截图（选填）
      description: 请尽量提供复现步骤、错误提示或截图。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……

  - type: textarea
    id: workbuddy-response
    attributes:
      label: WorkBuddy 完整回复（选填）
      placeholder: 请粘贴 WorkBuddy 的完整回复内容
