name: build-linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（x.y.z），留空则取 daemon.js 的 DAEMON_VERSION'
        required: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 解析版本
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(grep -o "DAEMON_VERSION = '[^']*'" scripts/daemon.js | head -1 | cut -d"'" -f2)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号不合法: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 校验构建脚本可执行
        run: chmod +x scripts/build-linux-tar.sh scripts/install-linux.sh scripts/uninstall-linux.sh scripts/relaunch-with-cdp-linux.sh scripts/apply-update-linux.sh

      - name: 运行单元测试
        run: node --test test/*.test.js

      - name: 构建 tar.gz 与 deb
        env:
          WORKDADDY_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-linux-tar.sh

      - name: 校验产物
        run: |
          ls -lh release/linux
          tar -tzf release/linux/WorkDaddy-*-linux-x64.tar.gz | grep -q 'WorkDaddy-linux/scripts/daemon.js'
          dpkg-deb -I release/linux/workdaddy_*_amd64.deb

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: workdaddy-linux
          path: |
            release/linux/*.tar.gz
            release/linux/*.deb

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/*.tar.gz
            release/linux/*.deb
